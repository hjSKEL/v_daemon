# Local SP1 daemon. DB/RabbitMQ credentials default to the packaged daemon settings.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/LOCAL_CSMS?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
server.address=127.0.0.1
daemon.health-check-enabled=false
