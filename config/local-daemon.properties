# Extra configuration for start-local-daemon.ps1; credentials come from the daemon JAR.
# The script fixes SP1, port 8900, the loopback bind and disables the extra health connector.
server.address=127.0.0.1
daemon.health-check-enabled=false
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/LOCAL_CSMS?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.rabbitmq.host=127.0.0.1
# Do not consume the existing daemon's shared Soft Reset command queue.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
