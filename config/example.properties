# Copy to config/local.properties. Credentials stay outside source code.
server.port=7088
request.timeout.seconds=15
logs.directory=logs
# Optional: read-only prerequisite verification. No database writes are implemented.
db.url=
db.username=
db.password=
# D:/LH_EV uses SP3 (mTLS): configure the client identity and local server trust store.
# PKCS12 or JKS. Server identity verification remains enabled.
tls.keyStore=D:/LH_EV/proxy-eai/cert/TEST20260901-client.p12
tls.keyStoreType=PKCS12
tls.keyStorePassword=
tls.trustStore=config/certs/lh-ev-server-trust.p12
tls.trustStoreType=PKCS12
tls.trustStorePassword=
